# Immich with HDR AVIF previews - TrueNAS SCALE custom app
#
# Paste this into: Apps -> Discover Apps -> Custom App -> "Install via YAML"
#
# Before installing:
#   1. Load the custom image on the NAS (see DEPLOY-TRUENAS.md):
#        docker load -i immich-server-hdr-amd64.tar.gz
#   2. Replace the three /mnt/... paths below with your real dataset paths.
#   3. Change DB_PASSWORD.
#
# Environment variables are inlined because the TrueNAS UI does not provide a
# .env file alongside the compose YAML.

name: immich

services:
  immich-server:
    container_name: immich_server
    # Locally loaded image, not from a registry. `pull_policy: never` stops
    # Docker trying (and failing) to fetch it from Docker Hub.
    image: immich-server-hdr:latest
    pull_policy: never
    volumes:
      # CHANGE ME - where your photos are stored
      - /mnt/tank/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD: CHANGE_ME_TO_A_RANDOM_PASSWORD
      REDIS_HOSTNAME: redis
      # CHANGE ME - your timezone
      TZ: Pacific/Auckland
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    # The N100 has Intel QuickSync. Uncomment to enable hardware transcoding.
    # devices:
    #   - /dev/dri:/dev/dri

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3
    volumes:
      - model-cache:/cache
    environment:
      TZ: Pacific/Auckland
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: CHANGE_ME_TO_A_RANDOM_PASSWORD
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if the database dataset is on spinning disks rather than SSD.
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # CHANGE ME - must be local storage, not a network share
      - /mnt/tank/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
