# Immich with HDR AVIF previews — TrueNAS SCALE 25.10 (Goldeye)
#
# Paste into: Apps → Discover Apps → Custom App → ⋮ → Install via YAML
#
# This is deliberately set up as a SEPARATE, SAFE TEST instance:
#   - its own datasets, so your existing photo library is never touched
#   - port 2284, so it will not clash with an existing Immich on 2283
#   - its own container names, so nothing collides
#
# Change the two /mnt/ paths and the two passwords below, then install.

services:
  immich-server:
    container_name: immich_hdr_server
    image: immich-server-hdr:latest
    # The image is loaded locally from a tar, not pulled from a registry.
    # Without this, deployment fails trying to reach Docker Hub.
    pull_policy: never
    volumes:
      # CHANGE ME
      - /mnt/tank/immich-hdr/library:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD: CHANGE_ME
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
      TZ: Pacific/Auckland
    ports:
      - '2284:2283'
    depends_on:
      - redis
      - database
    restart: unless-stopped

  immich-machine-learning:
    container_name: immich_hdr_ml
    image: ghcr.io/immich-app/immich-machine-learning:v3
    volumes:
      - model-cache:/cache
    environment:
      TZ: Pacific/Auckland
    restart: unless-stopped

  redis:
    container_name: immich_hdr_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  database:
    container_name: immich_hdr_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # CHANGE ME — must be local storage, never an SMB/NFS share
      - /mnt/tank/immich-hdr/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

volumes:
  model-cache:
